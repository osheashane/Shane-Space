      { title: 'The Tale of the Tiny White Snake', image: 'sb6.png', desc: 'Selected storyboard scenes created for an animated music video project, focusing on visual storytelling, scene composition, character placement and camera angles.' }

    ],

  };

  let currentCategory = '';
  let currentIndex = 0;
  let currentParentView = 'folder-menu';

  function openFolder(category) {
    if (category === 'storyboard') {
      // Hide Folder Menu, Show Storyboard Sub-Menu
      document.getElementById('folder-menu-view').classList.add('hidden');
      
      const sbView = document.getElementById('storyboard-menu-view');
      sbView.classList.remove('hidden');
      sbView.classList.add('flex');
    } else {
      currentParentView = 'folder-menu';
      openGallery(category);
    }
  }

  function openGallery(category) {
    // Determine where we came from to handle the Back button correctly
    if (category.startsWith('storyboard-')) {
      currentParentView = 'storyboard-menu';
      const sbView = document.getElementById('storyboard-menu-view');
      sbView.classList.add('hidden');
      sbView.classList.remove('flex');
    } else {
      currentParentView = 'folder-menu';
      document.getElementById('folder-menu-view').classList.add('hidden');
    }

    currentCategory = category;
    currentIndex = 0;
    updateGalleryDisplay();

    const viewer = document.getElementById('gallery-viewer-view');
    viewer.classList.remove('hidden');
    viewer.classList.add('flex');
  }

  function closeGallery() {
    const viewer = document.getElementById('gallery-viewer-view');
    viewer.classList.add('hidden');
    viewer.classList.remove('flex');

    // Return to Storyboard books if came from there, otherwise to Folder menu
    if (currentParentView === 'storyboard-menu') {
      const sbView = document.getElementById('storyboard-menu-view');
      sbView.classList.remove('hidden');
      sbView.classList.add('flex');
    } else {
      document.getElementById('folder-menu-view').classList.remove('hidden');
    }
  }

  function backToFolders() {
    const sbView = document.getElementById('storyboard-menu-view');
    sbView.classList.add('hidden');
    sbView.classList.remove('flex');
    
    document.getElementById('folder-menu-view').classList.remove('hidden');
  }

  function changePhoto(direction) {
    const list = portfolioData[currentCategory];
    if (!list || list.length === 0) return;

    currentIndex = (currentIndex + direction + list.length) % list.length;
    updateGalleryDisplay();
  }

  function updateGalleryDisplay() {
    const list = portfolioData[currentCategory] || [];
    const currentItem = list[currentIndex] || { title: 'No Title', image: '', desc: 'No item found' };

    document.getElementById('gallery-title').innerText = currentItem.title;
    document.getElementById('gallery-image').src = currentItem.image;
    document.getElementById('gallery-description').innerText = currentItem.desc;
    document.getElementById('gallery-counter').innerText = `${list.length > 0 ? currentIndex + 1 : 0}/${list.length}`;

    // Handle Visit Link Button dynamically
    const actionContainer = document.getElementById('gallery-action-container');
    if (currentItem.link) {
      actionContainer.innerHTML = `
        <a href="${currentItem.link}" target="_blank" rel="noopener noreferrer" 
           class="bg-white text-[#005498] font-bold px-4 py-2 rounded-lg border border-[#005498] hover:bg-gray-100 flex items-center gap-1 text-sm md:text-base shadow-sm transition-transform active:scale-95" style="font-family: 'Courier Prime', monospace;">
          <span>Visit Site ↗</span>
        </a>
      `;
    } else {
      actionContainer.innerHTML = '';
    }
  }
</script>
