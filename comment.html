<div class="w-full lg:w-1/2 flex flex-col">
  <!-- Centered Header with White Text Outline & Darker Shadow -->
  <h2 class="text-3xl md:text-4xl font-extrabold text-[#005498] mb-6 text-center" 
      style="font-family: 'Fredoka', sans-serif; text-shadow: 2px 2px 0px #FFF, -2px -2px 0px #FFF, 2px -2px 0px #FFF, -2px 2px 0px #FFF, 5px 5px 0px #5a97d4;">
    ✦ FEEDBACK ✦
  </h2>
  
  <div id="comments-scroll-area" class="flex-1 max-h-[600px] overflow-y-auto no-scrollbar flex flex-col gap-4 pr-1">
    <!-- Dynamic comments will be injected here -->
  </div>

<!-- Interactive Comment Script -->
  <script>
    // Star Rating Logic
    const stars = document.querySelectorAll('#star-rating-container .star');
    const ratingInput = document.getElementById('rating-value');

    stars.forEach((star, index) => {
      star.addEventListener('click', () => {
        const val = index + 1;
        ratingInput.value = val;
        stars.forEach((s, i) => {
          s.textContent = i < val ? '★' : '☆';
        });
      });
    });

    // Handle Comment Submission (Local DOM Manipulation)
    const commentForm = document.getElementById('comment-form');
    const commentsArea = document.getElementById('comments-scroll-area');

    commentForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('comment-name').value.trim();
      const text = document.getElementById('comment-text').value.trim();
      const rating = ratingInput.value;

      if (!name || !text) return;

      // Current Date and Time Formatting
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = now.toLocaleDateString();
      const dateTimeDisplay = `${timeStr} (${dateStr})`;

      // Create Comment Box Element matching reference mockup style
      const commentCard = document.createElement('div');
      commentCard.className = "bg-white/90 border-2 border-[#005498] rounded-xl p-5 shadow-sm flex flex-col gap-2 shrink-0";
      
      commentCard.innerHTML = `
        <div class="flex justify-between items-center border-b border-[#005498]/20 pb-2" style="font-family: 'Courier Prime', monospace;">
          <span class="font-bold text-[#2c3e50] text-lg">@${escapeHtml(name)}</span>
          <span class="text-xs text-[#2c3e50]/70 font-medium">${dateTimeDisplay}</span>
        </div>
        <div class="flex text-amber-400 text-sm">
          ${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}
        </div>
        <p class="font-medium break-words mt-1 text-[#2c3e50]" style="font-family: 'Courier Prime', monospace;">${escapeHtml(text)}</p>
      `;

      // Prepend so latest comment appears on top
      commentsArea.prepend(commentCard);

      // Reset form
      commentForm.reset();
      ratingInput.value = "5";
      stars.forEach(s => s.textContent = '★');
    });

    // Helper to prevent script injection
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
